[project]
name = "flux7-hoshi"
version = "0.0.1"
description = "A world where AI personas arrive with nothing and learn to live together"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
bound = ["scipy>=1.11"]   # tools/bound.py, the upper bound on the harvest
# Claude brains (claude:<model>), through the Anthropic API
claude = ["anthropic>=0.100"]
# the image tools (tools/tiles.py, tools/sprites.py)
art = ["pillow>=10.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hoshi7"]
